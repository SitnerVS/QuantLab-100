name: Bybit Demo connection and market data (self-hosted EU runner)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/bybit-demo-self-hosted.yml

permissions:
  contents: read

concurrency:
  group: bybit-demo-self-hosted
  cancel-in-progress: false

jobs:
  bybit-demo-read-only:
    runs-on: [self-hosted, macOS, quantlab-bybit-demo]
    timeout-minutes: 20
    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Create local Python virtual environment
        run: |
          echo "Python executable: $(command -v python3)"
          python3 --version
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip

      - name: Install project dependencies
        run: .venv/bin/python -m pip install -r requirements.txt

      - name: Verify Bybit Demo API connection (read-only)
        continue-on-error: true
        env:
          BYBIT_DEMO_API_KEY: ${{ secrets.BYBIT_DEMO_API_KEY }}
          BYBIT_DEMO_API_SECRET: ${{ secrets.BYBIT_DEMO_API_SECRET }}
        run: .venv/bin/python -m quantlab.exchange.cli

      - name: Download completed Bybit Demo linear candles (read-only)
        continue-on-error: true
        env:
          BYBIT_DEMO_API_KEY: ${{ secrets.BYBIT_DEMO_API_KEY }}
          BYBIT_DEMO_API_SECRET: ${{ secrets.BYBIT_DEMO_API_SECRET }}
          PYTHONFAULTHANDLER: "1"
        run: |
          .venv/bin/python --version
          for attempt in 1 2 3; do
            if .venv/bin/python -m quantlab.exchange.market_data_cli; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 120))
              echo "Bybit market-data request failed; retrying in ${delay}s (attempt $((attempt + 1))/3)."
              sleep "$delay"
            fi
          done
          exit 1

      - name: Download Bybit Demo linear perpetual mark and funding data (read-only)
        env:
          BYBIT_DEMO_API_KEY: ${{ secrets.BYBIT_DEMO_API_KEY }}
          BYBIT_DEMO_API_SECRET: ${{ secrets.BYBIT_DEMO_API_SECRET }}
          PYTHONFAULTHANDLER: "1"
        run: |
          for attempt in 1 2 3; do
            if .venv/bin/python -m quantlab.exchange.bybit_demo_futures_cli; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 120))
              echo "Bybit mark-price/funding request failed; retrying in ${delay}s (attempt $((attempt + 1))/3)."
              sleep "$delay"
            fi
          done
          exit 1

      - name: Upload connection and market-data reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bybit-demo-read-only-${{ github.run_number }}
          path: |
            reports/bybit_demo_connection.json
            reports/bybit_demo_market_data.json
            data/raw/bybit_demo_linear_*.csv
            reports/bybit_demo_futures_data.json
            data/bybit_demo/bybit_demo_linear_*.csv
          if-no-files-found: warn
          retention-days: 43
