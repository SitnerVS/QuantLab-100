project:
  name: QuantLab 100
  mode: paper
  timezone: UTC

capital:
  total_rub: 100.0
  portfolios:
    crypto_spot: 25.0
    crypto_futures_sim: 25.0
    forex_spot_sim: 25.0
    forex_leveraged_sim: 25.0

data:
  crypto:
    exchange: kraken
    symbols: ["BTC/USD", "ETH/USD", "SOL/USD"]
    timeframe: "1h"
    limit: 1000
  forex:
    symbols: ["EURUSD=X", "GBPUSD=X", "JPY=X", "RUB=X"]
    interval: "1d"
    period: "2y"
  futures:
    exchange: krakenfutures
    symbols: ["PF_XBTUSD", "PF_ETHUSD", "PF_SOLUSD"]
    timeframe: "1h"
    limit: 720
    min_order_sizes:
      PF_XBTUSD: 0.0001
      PF_ETHUSD: 0.001
      PF_SOLUSD: 0.01

costs:
  crypto_fee_rate: 0.0026
  forex_fee_rate: 0.0002
  slippage_rate: 0.0005
  crypto_spread_rate: 0.0002
  forex_spread_rate: 0.0003

backtest:
  initial_cash: 100.0
  min_observations: 60

paper:
  max_position_fraction: 0.25

validation:
  train_bars: 180
  test_bars: 60

bybit_demo_futures_validation:
  train_bars: 1440  # 60 days of hourly mark-price bars
  test_bars: 336   # 14 days of hourly out-of-sample bars

futures:
  leverage: 2.0
  max_margin_fraction: 0.25
  fee_rate: 0.0006
  slippage_rate: 0.0005
  spread_rate: 0.0002
  maintenance_margin_rate: 0.05
  liquidation_fee_rate: 0.025
  # Research-only limits for the risk-controlled long/short comparison.
  stop_loss_pct: 0.02
  max_drawdown_pct: 0.10
