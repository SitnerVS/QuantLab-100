name: QuantLab scheduled research

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: quantlab-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Download data and run research
        run: python -m quantlab.cli run --config config/settings.yaml
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantlab-research-${{ github.run_number }}
          path: |
            reports/
            data/processed/
          if-no-files-found: warn
          retention-days: 14
      - name: Commit generated reports and state
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed reports
          if ! git diff --cached --quiet; then
            git commit -m "Update QuantLab research outputs"
            git fetch origin main
            if git rebase origin/main; then
              git push origin HEAD:main
            else
              git rebase --abort
              echo "::warning::Concurrent update prevented committing generated state. The run artifact is preserved; the next run will retry."
            fi
          else
            echo "No report or state changes to commit."
          fi
