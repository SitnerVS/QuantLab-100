name: Bybit Demo Futures research (hosted Python 3.11)

on:
  workflow_run:
    workflows: ["Bybit Demo connection and market data (self-hosted EU runner)"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: bybit-demo-futures-research
  cancel-in-progress: true

jobs:
  research:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Download market data from successful Mac runner
        uses: actions/download-artifact@v4
        with:
          name: bybit-demo-read-only-${{ github.event.workflow_run.run_number }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Run isolated-margin futures research backtests
        run: python -m quantlab.exchange.bybit_demo_futures_research_cli --config config/settings.yaml

      - name: Upload Bybit Demo futures research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bybit-demo-futures-research-${{ github.event.workflow_run.run_number }}
          path: |
            data/bybit_demo/bybit_demo_linear_*.csv
            reports/bybit_demo_futures_data.json
            reports/bybit_demo_futures_backtest.json
            reports/bybit_demo_futures_backtest_summary.csv
            reports/bybit_demo_futures_walk_forward.csv
          if-no-files-found: warn
          retention-days: 14
