name: QuantLab scheduled research

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: quantlab-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Verify Bybit Demo API connection (read-only)
        env:
          BYBIT_DEMO_API_KEY: ${{ secrets.BYBIT_DEMO_API_KEY }}
          BYBIT_DEMO_API_SECRET: ${{ secrets.BYBIT_DEMO_API_SECRET }}
        run: python -m quantlab.exchange.cli
      - name: Download data and run research
        run: python -m quantlab.cli run --config config/settings.yaml
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantlab-research-${{ github.run_number }}
          path: |
            reports/
            data/processed/
            data/raw/
          if-no-files-found: warn
          retention-days: 14
      - name: Commit generated reports and state
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed reports
          if ! git diff --cached --quiet; then
            git commit -m "Update QuantLab research outputs"
            git fetch origin main
            if ! git rebase origin/main; then
              conflict_files="$(git diff --name-only --diff-filter=U)"
              for file in $conflict_files; do
                case "$file" in
                  data/processed/*|reports/*.csv)
                    git checkout --theirs -- "$file"
                    git add "$file"
                    ;;
                  *)
                    echo "::error::Unexpected rebase conflict in $file"
                    git rebase --abort
                    exit 1
                    ;;
                esac
              done
              GIT_EDITOR=true git rebase --continue
            fi
            git push origin HEAD:main
          else
            echo "No report or state changes to commit."
          fi
